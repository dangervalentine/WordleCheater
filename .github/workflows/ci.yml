name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - wordle-fork

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build

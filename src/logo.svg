<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="8" fill="#011627"/>

  <!-- 3x3 Wordle grid -->
  <!-- Row 1: white, white, green -->
  <rect x="5" y="5" width="16" height="16" rx="2.5" fill="#FFFFFF" stroke="#000" stroke-width="1.2"/>
  <rect x="24" y="5" width="16" height="16" rx="2.5" fill="#FFFFFF" stroke="#000" stroke-width="1.2"/>
  <rect x="43" y="5" width="16" height="16" rx="2.5" fill="#C3E88D" stroke="#000" stroke-width="1.2"/>

  <!-- Row 2: white, yellow, green -->
  <rect x="5" y="24" width="16" height="16" rx="2.5" fill="#FFFFFF" stroke="#000" stroke-width="1.2"/>
  <rect x="24" y="24" width="16" height="16" rx="2.5" fill="#FFCB6B" stroke="#000" stroke-width="1.2"/>
  <rect x="43" y="24" width="16" height="16" rx="2.5" fill="#C3E88D" stroke="#000" stroke-width="1.2"/>

  <!-- Row 3: green, green, green (solved!) -->
  <rect x="5" y="43" width="16" height="16" rx="2.5" fill="#C3E88D" stroke="#000" stroke-width="1.2"/>
  <rect x="24" y="43" width="16" height="16" rx="2.5" fill="#C3E88D" stroke="#000" stroke-width="1.2"/>
  <rect x="43" y="43" width="16" height="16" rx="2.5" fill="#C3E88D" stroke="#000" stroke-width="1.2"/>

  <!-- Checkmark overlay — "solved" indicator (dark outline for contrast) -->
  <polyline
    points="16,34 27,46 50,18"
    fill="none"
    stroke="#011627"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <polyline
    points="16,34 27,46 50,18"
    fill="none"
    stroke="#F07178"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
